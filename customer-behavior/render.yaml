services:
  - type: web
    name: behaviour-mirror
    env: python
    region: singapore
    plan: free
    rootDir: customer-behavior
    buildCommand: |
      pip install -r backend/requirements.txt &&
      cd frontend && npm install && npm run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
